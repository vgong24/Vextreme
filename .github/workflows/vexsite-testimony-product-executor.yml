name: VexSite Testimony Product Executor

on:
  push:
    branches:
      - VXG-101126-chatgpt-testimony-product-migration

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[VXG-GENERATED]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact feature head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Execute accepted Testimony migration
        run: node tools/vex-content-forge/project_stale_page_migration.js --formation docs/ingestion/workmaps/content-forge-testimony-stale-page-migration-formation.json

      - name: Regenerate repository read models
        run: |
          node lib/strings-compile.js
          node lib/build-string-identity-index.js
          node lib/build-arc-bundles.js
          node lib/build-index.js
          node lib/bump-fab-version.js
          node lib/build-vextreme.js
          node lib/build-sw.js
          node lib/build-analysis-index.js
          node lib/build-page-health.js
          node lib/build-archives.js
          node lib/build-demo.js
          node lib/build-specimens.js
          node lib/build-sitemap.js
          node lib/build-index-page.js
          node lib/build-lessons.js
          node lib/build-status.js
          node lib/build-roles.js
          node lib/build-ecosystem-hub.js
          node lib/build-roles-page.js
          node lib/build-terrain-map.js

      - name: Enforce claimed mutation membrane
        shell: python
        run: |
          import subprocess, sys
          exact = {
              'pages/the-testimony-of-victor-gong.html',
              'data/strings/source/pages/the-testimony-of-victor-gong.json',
              'data/viewmodels.json',
              'data/index.json',
              'data/analysis-index.json',
              'data/lessons.json',
              'data/roles.json',
              'data/status.json',
              'data/page-health.json',
              'data/terrain-map.json',
              'sw.js',
              'pages/build-health.html',
              'pages/archives.html',
              'pages/vextreme-demo.html',
              'pages/specimens.html',
              'pages/ecosystem-hub.html',
              'pages/roles-index.html',
              'sitemap.xml',
              'index.html',
              'widgets/fab-lang.js',
          }
          prefixes = ('data/strings/compiled/', 'data/strings/reports/', 'dist/')
          raw = subprocess.check_output(['git','status','--porcelain=v1','-z'])
          records = [item for item in raw.decode().split('\0') if item]
          bad = []
          changed = []
          for record in records:
              path = record[3:]
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              changed.append(path)
              if path not in exact and not path.startswith(prefixes):
                  bad.append(path)
          print('Changed paths:')
          for path in changed:
              print('  ' + path)
          if bad:
              print('UNCLAIMED GENERATED PATHS:', file=sys.stderr)
              for path in bad:
                  print('  ' + path, file=sys.stderr)
              sys.exit(1)

      - name: Commit deterministic product outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration outputs changed."
            exit 1
          fi
          git commit -m "VXG-101126: materialize current-generation Testimony [VXG-GENERATED] [VXG RealForever]"
          git push origin HEAD:VXG-101126-chatgpt-testimony-product-migration
