name: Witness Readers Generated Currentness One Shot

on:
  push:
    branches:
      - VXG-110526-witness-readers-generated-currentness-a001
    paths:
      - '.github/workflows/witness-readers-generated-currentness-once.yml'

permissions:
  contents: write

jobs:
  generate-and-self-remove:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate repository-owned outputs
        shell: bash
        run: |
          set -euo pipefail
          node lib/strings-compile.js
          node lib/build-string-identity-index.js
          node lib/build-arc-bundles.js
          node lib/build-index.js
          node lib/bump-fab-version.js
          node lib/build-shared-cache-generation.js
          node lib/build-vextreme.js
          node lib/build-sw.js
          node lib/build-analysis-index.js
          node lib/build-page-health.js
          node lib/build-archives.js
          node lib/build-demo.js
          node lib/build-specimens.js
          node lib/build-sitemap.js
          node lib/build-index-page.js
          node lib/build-lessons.js
          node lib/build-status.js
          node lib/build-roles.js
          node lib/build-ecosystem-hub.js
          node lib/build-roles-page.js
          node lib/build-terrain-map.js

      - name: Verify generator stayed inside the admitted membrane
        shell: bash
        run: |
          set -euo pipefail
          unexpected=0
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              data/analysis-index.json|data/index.json|data/page-health.json|data/strings/compiled/*|data/terrain-map.json|dist/*|index.html|lib/shell.js|lib/vextreme.js|pages/about-vextreme.html|pages/build-health.html|pages/terrain-map.html|pages/vex-support.html|pages/vextreme-demo.html|sitemap.xml|sw.js|widgets/fab-lang.js)
                ;;
              *)
                echo "::error::Unexpected generator path: $path"
                unexpected=1
                ;;
            esac
          done < <(git status --porcelain=v1 | sed -E 's/^.. //')
          test "$unexpected" -eq 0

      - name: Run affected reader proof
        run: node --test tests/152-dream-record-witness-outlives-window.test.js tests/153-witness-records-discovery-danger.test.js tests/154-witness-records-life-comes-toward-you.test.js

      - name: Commit generated currentness and self-remove
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/witness-readers-generated-currentness-once.yml
          git add -A
          if git diff --cached --quiet; then
            echo "::error::No generated-currentness delta to commit."
            exit 1
          fi
          git config user.name "VexGPT"
          git config user.email "174306002+VexGPT@users.noreply.github.com"
          git commit -m "VXG-110526: converge Witness Records generated currentness [VXG RealForever]"
          git push origin HEAD:${{ github.ref_name }}
