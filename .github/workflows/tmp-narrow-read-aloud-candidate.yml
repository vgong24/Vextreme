name: Temporary narrow Read Aloud candidate

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

concurrency:
  group: narrow-read-aloud-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  narrow:
    if: github.head_ref == 'VXG-102026-chatgpt-read-aloud-semantic-containers'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout exact candidate branch
        uses: actions/checkout@v4
        with:
          ref: VXG-102026-chatgpt-read-aloud-semantic-containers
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install exact dependencies
        run: npm ci

      - name: Remove unrelated generator drift and preserve source style
        shell: bash
        run: |
          set -euo pipefail
          BASE='518bb4ea9e0e504c17699b8053a2195bc961999d'

          mapfile -t CHANGED < <(git diff --name-only "$BASE"...HEAD)
          for path in "${CHANGED[@]}"; do
            case "$path" in
              .github/workflows/tmp-narrow-read-aloud-candidate.yml|\
              data/terrain-map.json|\
              docs/architecture.md|\
              docs/architecture/17-fab-autoload.md|\
              docs/lattice-map.json|\
              lib/shell.js|\
              lib/vextreme.js|\
              pages/terrain-map.html|\
              sw.js|\
              tests/97-fab-read-aloud.test.js|\
              widgets/fab-read-aloud.js|\
              dist/*)
                ;;
              *)
                git restore --source="$BASE" --worktree -- "$path"
                ;;
            esac
          done

          python3 - <<'PY'
          from pathlib import Path

          path = Path('widgets/fab-read-aloud.js')
          text = path.read_text(encoding='utf-8')
          old = '\n\n\n  function '
          count = text.count(old)
          if count != 3:
              raise SystemExit(f'expected exactly three generated triple-blank function seams, found {count}')
          path.write_text(text.replace(old, '\n\n  function '), encoding='utf-8')
          PY

          rm -f .github/workflows/tmp-narrow-read-aloud-candidate.yml

      - name: Regenerate only owned deterministic consequences
        run: |
          node lib/build-lattice-headers.js
          node lib/build-architecture.js
          node lib/build-vextreme.js
          node lib/build-sw.js
          node lib/build-terrain-map.js

      - name: Prove exact path membrane and generated fan-out
        shell: bash
        run: |
          set -euo pipefail
          BASE='518bb4ea9e0e504c17699b8053a2195bc961999d'
          mapfile -t PATHS < <(git diff --name-only "$BASE")
          printf '%s\n' 'Candidate paths after narrowing:' "${PATHS[@]}"

          UNEXPECTED=()
          DIST_COUNT=0
          for path in "${PATHS[@]}"; do
            case "$path" in
              dist/vextreme-*.js)
                DIST_COUNT=$((DIST_COUNT + 1))
                ;;
              data/terrain-map.json|\
              docs/architecture.md|\
              docs/architecture/17-fab-autoload.md|\
              docs/lattice-map.json|\
              lib/shell.js|\
              lib/vextreme.js|\
              pages/terrain-map.html|\
              sw.js|\
              tests/97-fab-read-aloud.test.js|\
              widgets/fab-read-aloud.js)
                ;;
              *)
                UNEXPECTED+=("$path")
                ;;
            esac
          done

          if ((${#UNEXPECTED[@]})); then
            printf '%s\n' 'Unexpected paths remain:' "${UNEXPECTED[@]}" >&2
            exit 1
          fi

          printf 'Generated God Script count: %s\n' "$DIST_COUNT"
          if [ "$DIST_COUNT" -ne 95 ]; then
            printf 'Expected 95 generated God Scripts, found %s\n' "$DIST_COUNT" >&2
            exit 1
          fi

          MISSING=()
          for path in \
            widgets/fab-read-aloud.js \
            tests/97-fab-read-aloud.test.js \
            docs/architecture/17-fab-autoload.md \
            docs/lattice-map.json \
            docs/architecture.md \
            data/terrain-map.json \
            lib/shell.js \
            lib/vextreme.js \
            pages/terrain-map.html \
            sw.js; do
            if git diff --quiet "$BASE" -- "$path"; then
              MISSING+=("$path")
            fi
          done
          if ((${#MISSING[@]})); then
            printf '%s\n' 'Expected changed paths are unchanged:' "${MISSING[@]}" >&2
            exit 1
          fi

      - name: Run focused and whole-repository proof
        run: |
          node --check widgets/fab-read-aloud.js
          node --test tests/97-fab-read-aloud.test.js tests/41-vextreme-fab-autoload.test.js
          npm run pr-ready
          git diff --check

      - name: Commit narrowed exact candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'VexGPT'
          git config user.email 'victor.gong@vextreme24.com'
          git add -A
          git diff --cached --stat
          git diff --cached --quiet && { echo 'No narrowing delta formed.' >&2; exit 1; }
          git commit --signoff -m 'VXG-102026: narrow readable-unit generated consequences [VXG RealForever]'
          git push origin HEAD:VXG-102026-chatgpt-read-aloud-semantic-containers
