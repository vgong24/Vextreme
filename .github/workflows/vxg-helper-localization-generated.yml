name: VXG helper — localization generated currentness

on:
  push:
    branches:
      - VXG-101126-helper-localization-generated-currentness

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: VXG-101126-helper-localization-generated-currentness
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Materialize deterministic generated outputs
        run: |
          node lib/strings-compile.js
          node lib/build-string-identity-index.js
          node lib/build-arc-bundles.js
          node lib/build-index.js
          node lib/bump-fab-version.js
          node lib/build-vextreme.js
          node lib/build-sw.js
          node lib/build-analysis-index.js
          node lib/build-page-health.js
          node lib/build-archives.js
          node lib/build-demo.js
          node lib/build-specimens.js
          node lib/build-sitemap.js
          node lib/build-index-page.js
          node lib/build-lessons.js
          node lib/build-status.js
          node lib/build-roles.js
          node lib/build-ecosystem-hub.js
          node lib/build-roles-page.js
          node lib/build-terrain-map.js

      - name: Commit generated tree and remove helper workflow
        run: |
          rm -f .github/workflows/vxg-helper-localization-generated.yml
          git config user.name "VexGPT"
          git config user.email "victor.gong@vextreme24.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No generated delta."
            exit 0
          fi
          git commit -m "[VexSite Localization] Materialize deterministic generated currentness

          [VXG RealForever]"
          git push origin HEAD:VXG-101126-helper-localization-generated-currentness
