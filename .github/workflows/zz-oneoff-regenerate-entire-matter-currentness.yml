name: One-off regenerate Entire Matter currentness

on:
  push:
    branches:
      - VXG-110126-entire-matter-generated-currentness

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Regenerate repository-owned artifacts
        shell: bash
        run: |
          set -euo pipefail
          node lib/strings-compile.js
          node lib/build-string-identity-index.js
          node lib/build-arc-bundles.js
          node lib/build-index.js
          node lib/bump-fab-version.js
          node lib/build-shared-cache-generation.js
          node lib/build-vextreme.js
          node lib/build-sw.js
          node lib/build-analysis-index.js
          node lib/build-page-health.js
          node lib/build-archives.js
          node lib/build-demo.js
          node lib/build-specimens.js
          node lib/build-sitemap.js
          node lib/build-index-page.js
          node lib/build-lessons.js
          node lib/build-status.js
          node lib/build-roles.js
          node lib/build-ecosystem-hub.js
          node lib/build-roles-page.js
          node lib/build-terrain-map.js

      - name: Verify the affected currentness surfaces
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 \
            tests/09-build-sw.test.js \
            tests/28-build-terrain-map.test.js \
            tests/139-entire-matter-return-reader.test.js \
            tests/140-entire-matter-sabotage-archive-continuity.test.js \
            tests/141-entire-matter-cover-evidence.test.js \
            tests/142-entire-matter-generated-currentness.test.js

      - name: Commit generated outputs and remove this one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "VexGPT"
          git config user.email "victor.gong@vextreme24.com"

          git add \
            data/strings/compiled \
            data/strings/reports \
            data/index.json \
            data/analysis-index.json \
            data/lessons.json \
            data/roles.json \
            data/status.json \
            data/page-health.json \
            data/terrain-map.json \
            dist \
            sw.js \
            pages/build-health.html \
            pages/archives.html \
            pages/vextreme-demo.html \
            pages/specimens.html \
            pages/specimen-*.html \
            pages/ecosystem-hub.html \
            pages/roles-index.html \
            sitemap.xml \
            index.html \
            widgets/fab-lang.js \
            lib/shell.js \
            lib/vextreme.js \
            pages/terrain-map.html \
            pages/about-vextreme.html \
            pages/vex-support.html

          git rm .github/workflows/zz-oneoff-regenerate-entire-matter-currentness.yml
          git status --short
          git commit -m "build: regenerate Entire Matter public surfaces [VXG RealForever]"
          git push origin HEAD:VXG-110126-entire-matter-generated-currentness
