name: VexSite 82N Generated Currentness Helper

on:
  push:
    branches:
      - VXG-101326-chatgpt-82n-generated-helper-a001

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact helper head
        uses: actions/checkout@v4
        with:
          ref: VXG-101326-chatgpt-82n-generated-helper-a001
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rebuild repository-owned generated artifacts
        run: |
          set -euo pipefail
          node lib/strings-compile.js
          node lib/build-string-identity-index.js
          node lib/build-arc-bundles.js
          node lib/build-index.js
          node lib/bump-fab-version.js
          node lib/build-vextreme.js
          node lib/build-sw.js
          node lib/build-analysis-index.js
          node lib/build-page-health.js
          node lib/build-archives.js
          node lib/build-demo.js
          node lib/build-specimens.js
          node lib/build-sitemap.js
          node lib/build-index-page.js
          node lib/build-lessons.js
          node lib/build-status.js
          node lib/build-roles.js
          node lib/build-ecosystem-hub.js
          node lib/build-roles-page.js
          node lib/build-terrain-map.js

      - name: Prove exact generated membrane and publish helper tree
        env:
          BASE_SHA: 62abec48f7b15b475cc4eb261aa8fc10978663ca
          HELPER_BRANCH: VXG-101326-chatgpt-82n-generated-helper-a001
        run: |
          set -euo pipefail

          git rm .github/workflows/vexsite-82n-generated-helper.yml

          cat > /tmp/expected-paths.txt <<'EOF'
          data/analysis-index.json
          data/index.json
          data/page-health.json
          data/strings/compiled/manifest.json
          data/strings/compiled/scopes/index.json
          data/strings/compiled/scopes/production/pages/the-liberation-protocol.ar.json
          data/strings/compiled/scopes/production/pages/the-liberation-protocol.de.json
          data/strings/compiled/scopes/production/pages/the-liberation-protocol.es.json
          data/strings/compiled/scopes/production/pages/the-liberation-protocol.fr.json
          data/strings/compiled/scopes/production/pages/the-liberation-protocol.hi.json
          data/strings/compiled/scopes/production/pages/the-liberation-protocol.ja.json
          data/strings/compiled/scopes/production/pages/the-liberation-protocol.ko.json
          data/strings/compiled/scopes/production/pages/the-liberation-protocol.pt.json
          data/strings/compiled/scopes/production/pages/the-liberation-protocol.zh.json
          data/strings/compiled/strings.ar.json
          data/strings/compiled/strings.de.json
          data/strings/compiled/strings.es.json
          data/strings/compiled/strings.fr.json
          data/strings/compiled/strings.hi.json
          data/strings/compiled/strings.ja.json
          data/strings/compiled/strings.ko.json
          data/strings/compiled/strings.pt.json
          data/strings/compiled/strings.zh.json
          dist/vextreme-the-liberation-protocol.js
          pages/build-health.html
          sw.js
          EOF
          sed -i 's/^          //' /tmp/expected-paths.txt
          sort -u /tmp/expected-paths.txt -o /tmp/expected-paths.txt

          git add -A -- \
            .github/workflows/vexsite-82n-generated-helper.yml \
            data/analysis-index.json \
            data/index.json \
            data/page-health.json \
            data/strings/compiled/manifest.json \
            data/strings/compiled/scopes/index.json \
            data/strings/compiled/scopes/production/pages/the-liberation-protocol.ar.json \
            data/strings/compiled/scopes/production/pages/the-liberation-protocol.de.json \
            data/strings/compiled/scopes/production/pages/the-liberation-protocol.es.json \
            data/strings/compiled/scopes/production/pages/the-liberation-protocol.fr.json \
            data/strings/compiled/scopes/production/pages/the-liberation-protocol.hi.json \
            data/strings/compiled/scopes/production/pages/the-liberation-protocol.ja.json \
            data/strings/compiled/scopes/production/pages/the-liberation-protocol.ko.json \
            data/strings/compiled/scopes/production/pages/the-liberation-protocol.pt.json \
            data/strings/compiled/scopes/production/pages/the-liberation-protocol.zh.json \
            data/strings/compiled/strings.ar.json \
            data/strings/compiled/strings.de.json \
            data/strings/compiled/strings.es.json \
            data/strings/compiled/strings.fr.json \
            data/strings/compiled/strings.hi.json \
            data/strings/compiled/strings.ja.json \
            data/strings/compiled/strings.ko.json \
            data/strings/compiled/strings.pt.json \
            data/strings/compiled/strings.zh.json \
            dist/vextreme-the-liberation-protocol.js \
            pages/build-health.html \
            sw.js

          git diff --cached --name-only "$BASE_SHA" | sort -u > /tmp/observed-paths.txt
          diff -u /tmp/expected-paths.txt /tmp/observed-paths.txt

          if git diff --cached --quiet "$BASE_SHA"; then
            echo "No generated delta was produced." >&2
            exit 31
          fi

          git config user.name "VexGPT"
          git config user.email "174306002+VexGPT@users.noreply.github.com"
          git commit -m "[VexSite Localization][82/N] Materialize Liberation Protocol generated currentness

Repository-owned generators only; exact 26-path generated membrane.

[VXG RealForever]"
          git push origin "HEAD:$HELPER_BRANCH"
