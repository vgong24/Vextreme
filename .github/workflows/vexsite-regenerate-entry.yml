name: VexSite Regenerate Entry Projections

on:
  push:
    branches:
      - VXG-100926-chatgpt-vexsite-lattice-runtime-coverage
    paths:
      - '.github/workflows/vexsite-regenerate-entry.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: VXG-100926-chatgpt-vexsite-lattice-runtime-coverage
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Regenerate exact entry-page projections
        run: |
          node lib/build-analysis-index.js
          node lib/build-page-health.js
          node lib/build-archives.js
      - name: Prove bounded generated delta
        run: |
          changed="$(git status --short --untracked-files=no | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' data/analysis-index.json data/page-health.json pages/build-health.html | sort)"
          printf 'changed:\n%s\n' "$changed"
          test "$changed" = "$expected"
      - name: Commit generated consequences
        run: |
          git config user.name "VexGPT"
          git config user.email "victor.gong@vextreme24.com"
          git add data/analysis-index.json data/page-health.json pages/build-health.html
          git commit --signoff -m "[VexSite Template] Regenerate entry-page projections [VXG RealForever]"
          git push origin HEAD:VXG-100926-chatgpt-vexsite-lattice-runtime-coverage
