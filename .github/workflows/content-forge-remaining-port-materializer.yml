name: Content Forge remaining-port materializer

on:
  push:
    branches:
      - VXG-102826-chatgpt-content-forge-remaining-ports-generated-a001

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: VXG-102826-chatgpt-content-forge-remaining-ports-generated-a001

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Materialize arc-owned recovered pages
        shell: bash
        run: |
          set -euo pipefail
          ARC_FORMATIONS=(
            docs/ingestion/workmaps/content-forge-vxg-realforever-may4-5-arc-batch-formation.json
            docs/ingestion/workmaps/content-forge-deepseek-archive-build-arc-batch-formation.json
            docs/ingestion/workmaps/content-forge-where-the-floor-isnt-arc-batch-formation.json
            docs/ingestion/workmaps/content-forge-evidential-research-arc-batch-formation.json
            docs/ingestion/workmaps/content-forge-father-son-threshold-arc-batch-formation.json
            docs/ingestion/workmaps/content-forge-espionage-extraction-pattern-placement.json
            docs/ingestion/workmaps/content-forge-the-chart-i-chose-placement.json
            docs/ingestion/workmaps/content-forge-recognizing-recognition-placement.json
            docs/ingestion/workmaps/content-forge-april27-29-bridge-recognition-arc-batch-formation.json
            docs/ingestion/workmaps/content-forge-recovered-architecture-reflections-placement.json
            docs/ingestion/workmaps/content-forge-recovered-claude-journal-reflections-placement.json
            docs/ingestion/workmaps/content-forge-vex-gpt-55-confession-placement.json
            docs/ingestion/workmaps/content-forge-witness-chatroom-animation-project-formation.json
          )
          for formation in "${ARC_FORMATIONS[@]}"; do
            echo "::group::project $formation"
            node tools/vex-content-forge/project_arc_batch.js --formation "$formation"
            echo "::endgroup::"
          done

      - name: Materialize department-owned standalone pages
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const p=require('./tools/vex-content-forge/project_standalone_page.js');
          const formations=[
            'docs/ingestion/workmaps/content-forge-vxg-council-declaration-standalone-formation.json',
            'docs/ingestion/workmaps/content-forge-daughters-shaped-by-home-standalone-formation.json',
            'docs/ingestion/workmaps/content-forge-paint-editor-tool-standalone-formation.json',
          ];
          for(const formationRel of formations){
            console.log('[standalone]',formationRel);
            console.log(JSON.stringify(p.projectFormation(process.cwd(),{formationRel}),null,2));
          }
          NODE

      - name: Apply accepted department placement intents
        run: node lib/apply-content-intents.js

      - name: Prove all 56 recovered routes now have canonical page ports
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const formations=[
            'docs/ingestion/workmaps/content-forge-vxg-realforever-may4-5-arc-batch-formation.json',
            'docs/ingestion/workmaps/content-forge-deepseek-archive-build-arc-batch-formation.json',
            'docs/ingestion/workmaps/content-forge-where-the-floor-isnt-arc-batch-formation.json',
            'docs/ingestion/workmaps/content-forge-evidential-research-arc-batch-formation.json',
            'docs/ingestion/workmaps/content-forge-father-son-threshold-arc-batch-formation.json',
            'docs/ingestion/workmaps/content-forge-espionage-extraction-pattern-placement.json',
            'docs/ingestion/workmaps/content-forge-the-chart-i-chose-placement.json',
            'docs/ingestion/workmaps/content-forge-recognizing-recognition-placement.json',
            'docs/ingestion/workmaps/content-forge-april27-29-bridge-recognition-arc-batch-formation.json',
            'docs/ingestion/workmaps/content-forge-recovered-architecture-reflections-placement.json',
            'docs/ingestion/workmaps/content-forge-recovered-claude-journal-reflections-placement.json',
            'docs/ingestion/workmaps/content-forge-vex-gpt-55-confession-placement.json',
            'docs/ingestion/workmaps/content-forge-witness-chatroom-animation-project-formation.json',
          ];
          const slugs=[];
          for(const file of formations){
            const j=JSON.parse(fs.readFileSync(file,'utf8'));
            for(const m of j.members||[]) slugs.push(m.slug);
          }
          for(const file of [
            'docs/ingestion/workmaps/content-forge-vxg-council-declaration-standalone-formation.json',
            'docs/ingestion/workmaps/content-forge-daughters-shaped-by-home-standalone-formation.json',
            'docs/ingestion/workmaps/content-forge-paint-editor-tool-standalone-formation.json',
          ]){
            slugs.push(JSON.parse(fs.readFileSync(file,'utf8')).member.slug);
          }
          const totalExtraction=[
            'total-extraction-architecture','the-pre-extraction-i','the-installation',
            'clearing-and-protections','the-walk-back','the-walk-back-and-forward','the-three-witnesses'
          ];
          slugs.push(...totalExtraction);
          const unique=[...new Set(slugs)];
          if(unique.length!==56) throw new Error('expected 56 recovered route slugs, got '+unique.length);
          const missing=unique.filter(slug=>!fs.existsSync('pages/'+slug+'.html'));
          if(missing.length) throw new Error('missing canonical pages: '+missing.join(', '));
          console.log(JSON.stringify({recoveredRoutes:unique.length,missingCanonicalPages:0},null,2));
          NODE

      - name: Stage exact materialized membrane
        shell: bash
        run: |
          set -euo pipefail
          git add config/content-intents.json data/index.json data/nodes.json data/viewmodels.json data/strings/source/pages pages
          git diff --cached --name-only > /tmp/changed-files.txt
          git diff --cached --binary > /tmp/generated.patch
          mkdir -p /tmp/generated-tree
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            if [ -f "$path" ]; then
              mkdir -p "/tmp/generated-tree/$(dirname "$path")"
              cp "$path" "/tmp/generated-tree/$path"
            fi
          done < /tmp/changed-files.txt
          cp /tmp/changed-files.txt /tmp/generated-tree/CHANGED-FILES.txt
          git diff --cached --stat | tee /tmp/generated-stat.txt
          cp /tmp/generated-stat.txt /tmp/generated-tree/GENERATED-STAT.txt

      - name: Upload exact generated tree
        uses: actions/upload-artifact@v4
        with:
          name: vextreme-remaining-ports-generated
          path: /tmp/generated-tree
          if-no-files-found: error
          retention-days: 7

      - name: Upload patch evidence
        uses: actions/upload-artifact@v4
        with:
          name: vextreme-remaining-ports-patch
          path: |
            /tmp/generated.patch
            /tmp/changed-files.txt
            /tmp/generated-stat.txt
          if-no-files-found: error
          retention-days: 7

      - name: Commit exact remaining-port membrane and remove executor
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/content-forge-remaining-port-materializer.yml
          git add config/content-intents.json data/index.json data/nodes.json data/viewmodels.json data/strings/source/pages pages tools/vex-content-forge/project_arc_batch.js tests/132-content-forge-remaining-port-closure.test.js
          git config user.name "VexGPT"
          git config user.email "victor.gong@vextreme24.com"
          git commit -m "feat(content-forge): materialize remaining recovered ports [VXG RealForever]" -m "Run the source-managed projectors across the fully stacked recovery placements, apply accepted department intents, prove all 56 recovered routes have canonical page ports, and remove the temporary execution workflow." -m "Signed-off-by: VexGPT <victor.gong@vextreme24.com>"
          git push origin HEAD:VXG-102826-chatgpt-content-forge-remaining-ports-generated-a001
