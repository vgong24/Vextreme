name: VexSite Browser Evidence

on:
  push:
    branches:
      - VXG-100926-chatgpt-vexsite-lattice-runtime-coverage
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terrain-entry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install repository dependencies
        run: npm ci
      - name: Install one-run browser carrier
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Render exact-head Terrain entry
        run: |
          mkdir -p artifacts
          cat > /tmp/terrain-evidence.cjs <<'NODE'
          'use strict';
          const fs = require('fs');
          const http = require('http');
          const path = require('path');
          const { chromium } = require('playwright');

          const ROOT = process.cwd();
          const OUT = path.join(ROOT, 'artifacts');
          const MIME = {
            '.css':'text/css; charset=utf-8',
            '.html':'text/html; charset=utf-8',
            '.js':'text/javascript; charset=utf-8',
            '.json':'application/json; charset=utf-8',
            '.png':'image/png',
            '.svg':'image/svg+xml',
            '.webp':'image/webp'
          };
          const assert = (value, message) => { if (!value) throw new Error(message); };
          const mime = file => MIME[path.extname(file).toLowerCase()] || 'application/octet-stream';

          function startServer() {
            return new Promise((resolve, reject) => {
              const server = http.createServer((request, response) => {
                let pathname;
                try { pathname = decodeURIComponent(new URL(request.url, 'http://127.0.0.1').pathname); }
                catch (_) { response.writeHead(400).end('Bad request'); return; }
                if (pathname === '/Vextreme') pathname = '/';
                else if (pathname.startsWith('/Vextreme/')) pathname = pathname.slice('/Vextreme'.length);
                const file = path.resolve(ROOT, '.' + pathname);
                if (file !== ROOT && !file.startsWith(ROOT + path.sep)) { response.writeHead(403).end('Forbidden'); return; }
                fs.readFile(file, (error, data) => {
                  if (error) { response.writeHead(error.code === 'ENOENT' ? 404 : 500).end('Not found'); return; }
                  response.writeHead(200, {'Content-Type':mime(file)});
                  response.end(data);
                });
              });
              server.once('error', reject);
              server.listen(0, '127.0.0.1', () => resolve({server, port:server.address().port}));
            });
          }

          async function routeBranchRuntime(page) {
            await page.route('https://cdn.jsdelivr.net/gh/vgong24/vextreme@main/**', async route => {
              const url = new URL(route.request().url());
              const marker = '/gh/vgong24/vextreme@main/';
              const at = url.pathname.indexOf(marker);
              const rel = at >= 0 ? url.pathname.slice(at + marker.length) : '';
              const file = path.resolve(ROOT, rel);
              if (!rel || (file !== ROOT && !file.startsWith(ROOT + path.sep)) || !fs.existsSync(file)) {
                await route.abort();
                return;
              }
              await route.fulfill({status:200, contentType:mime(file), body:fs.readFileSync(file)});
            });
          }

          function overlaps(a,b) {
            if (!a || !b) return false;
            return !(a.right <= b.left || b.right <= a.left || a.bottom <= b.top || b.bottom <= a.top);
          }

          async function arrivalMetrics(page) {
            return page.evaluate(() => {
              const rect = el => {
                if (!el) return null;
                const r = el.getBoundingClientRect();
                return {left:r.left,top:r.top,right:r.right,bottom:r.bottom,width:r.width,height:r.height};
              };
              const html = document.documentElement;
              const body = document.body;
              const cards = Array.from(document.querySelectorAll('.entry-card'));
              const navHrefs = Array.from(document.querySelectorAll('#vex-site-nav a[href]')).map(a => a.href);
              return {
                width: window.innerWidth,
                height: window.innerHeight,
                horizontalOverflow: Math.max(html.scrollWidth, body.scrollWidth) - window.innerWidth,
                activeChoices: cards.filter(card => !card.disabled).map(card => card.textContent.replace(/\s+/g,' ').trim()),
                disabledChoices: cards.filter(card => card.disabled).map(card => card.textContent.replace(/\s+/g,' ').trim()),
                rail: rect(document.getElementById('levelReadout')),
                firstCard: rect(cards[0]),
                nav: rect(document.getElementById('vex-nav')),
                fab: rect(document.getElementById('vex-spiral-fab')),
                mapOrbPresent: !!document.getElementById('vex-map-orb'),
                providerHrefPresent: navHrefs.some(href => /vextreme24\.com/i.test(href)),
                spiralExpanded: document.getElementById('vex-spiral-trigger')?.getAttribute('aria-expanded'),
                groupChildren: document.querySelectorAll('#vex-spiral-group > *').length,
                profile: new URL(location.href).searchParams.get('profile'),
                view: new URL(location.href).searchParams.get('view')
              };
            });
          }

          async function verifyArrival(page, label) {
            await page.waitForSelector('[data-terrain-entry="arrival"]');
            await page.waitForSelector('#vex-spiral-trigger');
            await page.waitForSelector('#vex-theme-orb');
            await page.waitForSelector('#vex-lang-fab');
            const metrics = await arrivalMetrics(page);
            assert(metrics.view === 'content' && metrics.profile === 'evolution-v1', label + ': wrong Terrain route');
            assert(metrics.horizontalOverflow <= 1, label + ': horizontal overflow ' + metrics.horizontalOverflow);
            assert(metrics.activeChoices.length === 2, label + ': expected exactly two active entry choices');
            assert(metrics.disabledChoices.length === 1 && /For VexSystem/.test(metrics.disabledChoices[0]), label + ': reserved VexSystem choice not inert');
            assert(!metrics.mapOrbPresent, label + ': redundant Terrain map orb is present');
            assert(!metrics.providerHrefPresent, label + ': active nav still points at vextreme24.com');
            assert(metrics.groupChildren === 2, label + ': expected only language/theme FAB children, got ' + metrics.groupChildren);
            assert(!overlaps(metrics.rail, metrics.firstCard), label + ': passive depth rail overlaps entry card');
            return metrics;
          }

          async function frameOverflow(page) {
            const frame = page.frames().find(f => f !== page.mainFrame() && /(?:receive-god|take-a-walk)\.html/.test(f.url()));
            assert(frame, 'entry iframe not found');
            return frame.evaluate(() => Math.max(document.documentElement.scrollWidth, document.body.scrollWidth) - window.innerWidth);
          }

          async function runCell(browser, baseUrl, name, viewport, colorScheme) {
            const context = await browser.newContext({viewport, colorScheme});
            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', error => errors.push('pageerror: ' + error.message));
            page.on('requestfailed', request => {
              const url = request.url();
              if (/127\.0\.0\.1|cdn\.jsdelivr\.net\/gh\/vgong24\/vextreme@main/.test(url)) {
                errors.push('requestfailed: ' + url + ' :: ' + (request.failure()?.errorText || 'unknown'));
              }
            });
            await routeBranchRuntime(page);
            const terrainUrl = baseUrl + '/Vextreme/pages/terrain-map.html?view=content&profile=evolution-v1';
            await page.goto(terrainUrl, {waitUntil:'domcontentloaded'});
            const initial = await verifyArrival(page, name);
            await page.screenshot({path:path.join(OUT, name + '-arrival-closed.png'), fullPage:false});

            await page.click('#vex-spiral-trigger');
            await page.waitForFunction(() => document.getElementById('vex-spiral-trigger')?.getAttribute('aria-expanded') === 'true');
            const opened = await arrivalMetrics(page);
            assert(opened.groupChildren === 2 && !opened.mapOrbPresent, name + ': FAB open state owns wrong children');
            await page.screenshot({path:path.join(OUT, name + '-arrival-fab-open.png'), fullPage:false});

            const themeBefore = await page.evaluate(() => document.documentElement.getAttribute('data-theme') || '');
            await page.click('#vex-theme-fab-btn');
            await page.waitForTimeout(120);
            const themeAfter = await page.evaluate(() => document.documentElement.getAttribute('data-theme') || '');
            assert(themeAfter && themeAfter !== themeBefore, name + ': theme orb did not change document theme');
            await page.screenshot({path:path.join(OUT, name + '-arrival-theme-toggled.png'), fullPage:false});
            await page.click('#vex-spiral-trigger');

            await page.click('[data-entry-action="receive-god"]');
            await page.waitForSelector('#evolutionReader:not([hidden])');
            const receiveFrame = page.frameLocator('#evolutionReaderFrame');
            await receiveFrame.locator('html[data-vex-entry-document="receive-god"]').waitFor();
            assert(await frameOverflow(page) <= 1, name + ': Receive God iframe horizontally overflows');
            assert(await page.locator('#readerPrev').isHidden(), name + ': entry reader exposed Previous');
            assert(await page.locator('#readerNext').isHidden(), name + ': entry reader exposed Next');
            assert(await page.locator('#levelReadout').isHidden(), name + ': depth rail visible over entry reader');
            await page.screenshot({path:path.join(OUT, name + '-receive-god.png'), fullPage:false});

            await receiveFrame.locator('a[href="take-a-walk.html"]').first().click();
            await receiveFrame.locator('html[data-vex-entry-document="take-a-walk"]').waitFor();
            assert(await frameOverflow(page) <= 1, name + ': Take a Walk iframe horizontally overflows');
            const outerUrlDuringWalk = page.url();
            assert(/terrain-map\.html/.test(outerUrlDuringWalk), name + ': Take a Walk escaped Terrain');
            await page.screenshot({path:path.join(OUT, name + '-take-a-walk.png'), fullPage:false});

            await page.click('#readerBack');
            await verifyArrival(page, name + '-returned');

            await page.click('[data-entry-action="archives"]');
            await page.waitForFunction(() => document.querySelectorAll('.stage-card').length > 0);
            assert(!page.url().includes('page='), name + ': Archives transition invented a page route');
            await page.screenshot({path:path.join(OUT, name + '-archives.png'), fullPage:false});

            const homeHref = await page.locator('.vex-nav-title').getAttribute('href');
            assert(homeHref === '/Vextreme/pages/terrain-map.html?view=content&profile=evolution-v1', name + ': Vex Life home target drifted');
            await Promise.all([
              page.waitForNavigation({waitUntil:'domcontentloaded'}),
              page.click('.vex-nav-title')
            ]);
            await verifyArrival(page, name + '-home');

            assert(errors.length === 0, name + ': browser errors: ' + errors.join(' | '));
            await context.close();
            return {name, viewport, colorScheme, initial, opened, themeBefore, themeAfter, errors};
          }

          (async () => {
            const {server, port} = await startServer();
            const browser = await chromium.launch({headless:true});
            try {
              const baseUrl = 'http://127.0.0.1:' + port;
              const report = {
                head: process.env.GITHUB_SHA || null,
                generatedAt: new Date().toISOString(),
                cells: [
                  await runCell(browser, baseUrl, 'desktop', {width:1440,height:1000}, 'dark'),
                  await runCell(browser, baseUrl, 'mobile', {width:390,height:844}, 'light')
                ]
              };
              fs.writeFileSync(path.join(OUT, 'terrain-browser-report.json'), JSON.stringify(report, null, 2) + '\n');
            } finally {
              await browser.close();
              await new Promise(resolve => server.close(resolve));
            }
          })().catch(error => { console.error(error.stack || error); process.exit(1); });
          NODE
          node /tmp/terrain-evidence.cjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vexsite-terrain-browser-evidence
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
