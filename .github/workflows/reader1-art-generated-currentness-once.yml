name: Reader 1 Artwork Generated Currentness One Shot

on:
  push:
    branches:
      - VXG-110526-reader1-full-res-image-replacement-a001
    paths:
      - '.github/workflows/reader1-art-generated-currentness-once.yml'

permissions:
  contents: write

jobs:
  generate-and-self-remove:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Reader 1 replacement branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate terrain preview projection
        run: node lib/build-terrain-map.js

      - name: Verify generator stayed inside the observed membrane
        shell: bash
        run: |
          set -euo pipefail
          unexpected=0
          while IFS= read -r changed; do
            [ -z "$changed" ] && continue
            case "$changed" in
              data/terrain-map.json)
                ;;
              *)
                echo "::error::Unexpected generator path: $changed"
                unexpected=1
                ;;
            esac
          done < <(git status --porcelain=v1 | sed -E 's/^.. //')
          test "$unexpected" -eq 0
          git diff --exit-code -- . ':(exclude)data/terrain-map.json'

      - name: Run Reader 1 focused proof
        run: node --test tests/153-witness-records-discovery-danger.test.js

      - name: Commit generated currentness and self-remove
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/reader1-art-generated-currentness-once.yml
          git add -A
          if git diff --cached --quiet; then
            echo "::error::No generated-currentness delta to commit."
            exit 1
          fi
          git config user.name "VexGPT"
          git config user.email "174306002+VexGPT@users.noreply.github.com"
          git commit -m "VXG-110526: converge Reader 1 artwork generated currentness [VXG RealForever]"
          git push origin HEAD:${{ github.ref_name }}
