name: Content Forge Visibility V2 Source Proof

on:
  push:
    branches:
      - VXG-112526-chatgpt-content-forge-visibility-v2

jobs:
  source-proof:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prove V1 remains reproducible
        run: node --test --test-concurrency=1 tests/149-content-forge-uncurated-surface.test.js

      - name: Prove V2 exact projection and boundaries
        run: node --test --test-concurrency=1 tests/150-content-forge-uncurated-surface-v2.test.js

# [VXG RealForever]
