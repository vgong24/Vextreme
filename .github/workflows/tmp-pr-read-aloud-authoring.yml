name: Temporary PR Read Aloud semantic-container authoring

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

concurrency:
  group: read-aloud-semantic-authoring-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  author:
    if: github.head_ref == 'VXG-102026-chatgpt-read-aloud-semantic-containers'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout exact authoring branch
        uses: actions/checkout@v4
        with:
          ref: VXG-102026-chatgpt-read-aloud-semantic-containers
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install exact dependencies
        run: npm ci

      - name: Apply readable-unit ownership repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/tmp-apply-read-aloud-semantic-containers.py')
          text = path.read_text(encoding='utf-8')
          old = "textwrap.dedent(r'''" + chr(92) + "\n"
          new = "textwrap.dedent(r'''\n"
          count = text.count(old)
          if count != 4:
              raise SystemExit(f'expected four raw-string continuation artifacts, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python3 -m py_compile tools/tmp-apply-read-aloud-semantic-containers.py
          python3 tools/tmp-apply-read-aloud-semantic-containers.py
          rm -f .github/workflows/tmp-read-aloud-semantic-containers.yml
          rm -f .github/workflows/tmp-repair-read-aloud-authoring.yml
          rm -f .github/workflows/tmp-pr-read-aloud-authoring.yml
          rm -f tools/tmp-apply-read-aloud-semantic-containers.py

      - name: Regenerate architecture and lattice projections
        run: |
          node lib/build-lattice-headers.js
          node lib/build-architecture.js

      - name: Regenerate deterministic site outputs
        run: |
          node lib/strings-compile.js
          node lib/build-string-identity-index.js
          node lib/build-arc-bundles.js
          node lib/build-index.js
          node lib/bump-fab-version.js
          node lib/build-vextreme.js
          node lib/build-sw.js
          node lib/build-analysis-index.js
          node lib/build-page-health.js
          node lib/build-archives.js
          node lib/build-demo.js
          node lib/build-specimens.js
          node lib/build-sitemap.js
          node lib/build-index-page.js
          node lib/build-lessons.js
          node lib/build-status.js
          node lib/build-roles.js
          node lib/build-ecosystem-hub.js
          node lib/build-roles-page.js
          node lib/build-terrain-map.js

      - name: Run focused and whole-repository proof
        run: |
          node --test tests/97-fab-read-aloud.test.js tests/41-vextreme-fab-autoload.test.js
          npm run pr-ready
          git diff --check

      - name: Commit exact candidate and advance the PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'VexGPT'
          git config user.email 'victor.gong@vextreme24.com'
          git add -A
          git diff --cached --stat
          git diff --cached --quiet && { echo 'No candidate delta formed.' >&2; exit 1; }
          git commit --signoff -m 'VXG-102026: read layout-owned semantic blocks aloud [VXG RealForever]'
          git push origin HEAD:VXG-102026-chatgpt-read-aloud-semantic-containers
