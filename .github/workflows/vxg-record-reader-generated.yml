name: Temporary Record Reader Generated Bytes

on:
  push:
    branches:
      - VXG-102026-chatgpt-recognizing-life-reader
    paths:
      - '.github/workflows/vxg-record-reader-generated.yml'

permissions:
  contents: write
  actions: read

jobs:
  apply:
    if: github.event.head_commit.message == 'VXG-102026: apply exact generated artifact [VXG RealForever]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Prove only carrier changed since generated source head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only 1c1beeff84cd9780539ddcb6d1ac1aca2377c2fb..HEAD)" = ".github/workflows/vxg-record-reader-generated.yml"

      - name: Download exact generated artifact
        uses: actions/download-artifact@v4
        with:
          name: record-reader-generated-1c1beeff84cd9780539ddcb6d1ac1aca2377c2fb
          path: /tmp/record-reader-generated
          github-token: ${{ github.token }}
          run-id: 39407769873

      - name: Verify and apply exact generated bytes
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/record-reader-generated
          test "$(cat source-head.txt)" = "1c1beeff84cd9780539ddcb6d1ac1aca2377c2fb"
          echo "8def1334ac097c7839c136dd065bb7575c82091c6fba8d74c6dae4dd7e901a86  generated-files.tgz" | sha256sum -c -
          test "$(wc -l < generated-files.txt | tr -d ' ')" -eq 110
          while IFS= read -r path; do
            case "$path" in
              data/analysis-index.json|data/index.json|data/page-health.json|data/strings/compiled/manifest.json|data/strings/compiled/scopes/index.json|data/strings/compiled/scopes/production/pages/recognizing-life-receiving-abundance.en.json|data/strings/compiled/strings.en.json|data/terrain-map.json|dist/*|index.html|pages/build-health.html|pages/vextreme-demo.html|sitemap.xml|sw.js|widgets/fab-lang.js) ;;
              *) echo "Unexpected generated path: $path" >&2; exit 41 ;;
            esac
          done < generated-files.txt
          tar -xzf generated-files.tgz -C "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git add data/analysis-index.json data/index.json data/page-health.json data/strings/compiled/manifest.json data/strings/compiled/scopes/index.json data/strings/compiled/scopes/production/pages/recognizing-life-receiving-abundance.en.json data/strings/compiled/strings.en.json data/terrain-map.json dist index.html pages/build-health.html pages/vextreme-demo.html sitemap.xml sw.js widgets/fab-lang.js
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" -eq 110
          diff -u /tmp/record-reader-generated/generated-files.txt <(git diff --cached --name-only)

      - name: Commit and push exact generated tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "VexGPT"
          git config user.email "174306002+VexGPT@users.noreply.github.com"
          git commit -m "VXG-102026: converge Recognizing Life generated artifacts [VXG RealForever]"
          git push origin HEAD:VXG-102026-chatgpt-recognizing-life-reader
