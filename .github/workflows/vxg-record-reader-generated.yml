name: Temporary Record Reader Generated Bytes

on:
  push:
    branches:
      - VXG-102026-chatgpt-recognizing-life-reader
    paths:
      - '.github/workflows/vxg-record-reader-generated.yml'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run repository-owned generators
        shell: bash
        run: |
          set -euo pipefail
          node lib/strings-compile.js
          node lib/build-string-identity-index.js
          node lib/build-arc-bundles.js
          node lib/build-index.js
          node lib/bump-fab-version.js
          node lib/build-vextreme.js
          node lib/build-sw.js
          node lib/build-analysis-index.js
          node lib/build-page-health.js
          node lib/build-archives.js
          node lib/build-demo.js
          node lib/build-specimens.js
          node lib/build-sitemap.js
          node lib/build-index-page.js
          node lib/build-lessons.js
          node lib/build-status.js
          node lib/build-roles.js
          node lib/build-ecosystem-hub.js
          node lib/build-roles-page.js
          node lib/build-terrain-map.js

      - name: Bind exact generated delta
        shell: bash
        run: |
          set -euo pipefail
          git add data/strings/compiled data/strings/reports data/index.json data/analysis-index.json data/lessons.json data/roles.json data/status.json data/page-health.json data/terrain-map.json dist sw.js pages/build-health.html pages/archives.html pages/vextreme-demo.html pages/specimens.html pages/specimen-*.html pages/ecosystem-hub.html pages/roles-index.html sitemap.xml index.html widgets/fab-lang.js
          git diff --cached --name-only > generated-files.txt
          test -s generated-files.txt
          while IFS= read -r path; do
            case "$path" in
              data/analysis-index.json|data/index.json|data/page-health.json|data/strings/compiled/manifest.json|data/strings/compiled/scopes/index.json|data/strings/compiled/scopes/production/pages/recognizing-life-receiving-abundance.en.json|data/strings/compiled/strings.en.json|data/terrain-map.json|dist/*|index.html|pages/build-health.html|pages/vextreme-demo.html|sitemap.xml|sw.js|widgets/fab-lang.js) ;;
              *) echo "Unexpected generated path: $path" >&2; exit 41 ;;
            esac
          done < generated-files.txt
          test "$(wc -l < generated-files.txt | tr -d ' ')" -eq 110
          tar -czf generated-files.tgz -T generated-files.txt
          git diff --cached --stat > generated-stat.txt
          git rev-parse HEAD > source-head.txt

      - name: Upload exact generated bytes
        uses: actions/upload-artifact@v4
        with:
          name: record-reader-generated-${{ github.sha }}
          path: |
            generated-files.tgz
            generated-files.txt
            generated-stat.txt
            source-head.txt
          if-no-files-found: error
          retention-days: 1
