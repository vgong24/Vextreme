name: Content Forge Claude Journals Materializer

on:
  push:
    branches: [VXG-100426-vex-content-forge-claude-journals-arc-batch]
    paths:
      - '.github/workflows/content-forge-claude-journals-materialize.yml'
      - 'docs/ingestion/workmaps/content-forge-claude-journals-arc-batch-formation.json'
      - 'tools/vex-content-forge/project_arc_batch.js'
      - 'tests/62-content-forge-claude-journals-arc-batch.test.js'

jobs:
  materialize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: VXG-100426-vex-content-forge-claude-journals-arc-batch
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Project Claude Journals
        run: node tools/vex-content-forge/project_arc_batch.js --formation docs/ingestion/workmaps/content-forge-claude-journals-arc-batch-formation.json
      - name: Converge builders twice
        shell: bash
        run: |
          for pass in 1 2; do
            echo "builder pass $pass"
            node lib/strings-compile.js
            node lib/build-string-identity-index.js
            node lib/build-arc-bundles.js
            node lib/build-index.js
            node lib/bump-fab-version.js
            node lib/build-vextreme.js
            node lib/build-sw.js
            node lib/build-analysis-index.js
            node lib/build-page-health.js
            node lib/build-archives.js
            node lib/build-demo.js
            node lib/build-specimens.js
            node lib/build-sitemap.js
            node lib/build-index-page.js
            node lib/build-lessons.js
            node lib/build-status.js
            node lib/build-roles.js
            node lib/build-ecosystem-hub.js
            node lib/build-roles-page.js
            node lib/build-terrain-map.js
          done
      - name: Proof
        run: |
          node --test tests/61-content-forge-convos-with-god-arc-batch.test.js tests/62-content-forge-claude-journals-arc-batch.test.js
          npm run pr-ready
      - name: Collect exact materialized bytes
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, shutil, subprocess
          root = pathlib.Path('.').resolve()
          out = pathlib.Path('/tmp/materialized')
          out.mkdir(parents=True, exist_ok=True)
          raw = subprocess.check_output(['git','status','--porcelain=v1','-z'])
          records = [r for r in raw.split(b'\0') if r]
          paths = []
          for rec in records:
              status = rec[:2].decode('ascii', 'replace')
              rel = rec[3:].decode('utf-8')
              if ' -> ' in rel:
                  rel = rel.split(' -> ', 1)[1]
              src = root / rel
              if not src.is_file():
                  continue
              dst = out / rel
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)
              data = src.read_bytes()
              paths.append({'path': rel, 'status': status, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()})
          paths.sort(key=lambda x: x['path'])
          (out/'MATERIALIZED-MANIFEST.json').write_text(json.dumps({
              'schemaVersion':'vex-content-forge.materialized-output/v0.1',
              'base':'c1d1ed3bde90ae7d145ec50429be3e7775c6d262',
              'sourceHead':subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
              'files':paths,
          }, indent=2)+'\n')
          print(json.dumps(paths, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: claude-journals-materialized
          path: /tmp/materialized
          if-no-files-found: error
          retention-days: 1
      - name: Commit exact materialized bytes
        shell: bash
        run: |
          git config user.name "VexGPT"
          git config user.email "victor.gong@vextreme24.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No materialized delta to commit."
          else
            git commit -s -m "[Vex Content Forge] Materialize Claude Journals arc batch"
            git push origin HEAD:VXG-100426-vex-content-forge-claude-journals-arc-batch
          fi
