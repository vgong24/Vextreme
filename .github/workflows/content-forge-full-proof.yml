name: Content Forge exact-head full proof

on:
  push:
    branches:
      - VXG-102826-chatgpt-content-forge-remaining-ports-generated-a001

permissions:
  contents: write

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: VXG-102826-chatgpt-content-forge-remaining-ports-generated-a001
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build test prerequisites
        run: node lib/run-test-prereqs.js

      - name: Run full repository test suite
        shell: bash
        run: |
          set +e
          node --test --test-concurrency=1 tests/*.test.js > /tmp/full-test.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "Full test suite failed; concise failure surface follows."
            grep -E '^(not ok|# fail|# tests|# pass|# cancelled|# skipped|# todo|# duration_ms)|AssertionError|ERR_ASSERTION|failureType|location:' /tmp/full-test.log | tail -n 300 || true
            exit "$status"
          fi
          grep -E '^# (tests|pass|fail|cancelled|skipped|todo|duration_ms)' /tmp/full-test.log | tail -n 20 || true

      - name: Regenerate exact build-index outputs
        shell: bash
        run: |
          set -euo pipefail
          node lib/strings-compile.js
          node lib/build-string-identity-index.js
          node lib/build-arc-bundles.js
          node lib/build-index.js
          node lib/bump-fab-version.js
          node lib/build-shared-cache-generation.js
          node lib/build-vextreme.js
          node lib/build-sw.js
          node lib/build-analysis-index.js
          node lib/build-page-health.js
          node lib/build-archives.js
          node lib/build-demo.js
          node lib/build-specimens.js
          node lib/build-sitemap.js
          node lib/build-index-page.js
          node lib/build-lessons.js
          node lib/build-status.js
          node lib/build-roles.js
          node lib/build-ecosystem-hub.js
          node lib/build-roles-page.js
          node lib/build-terrain-map.js

      - name: Prove generated/runtime currentness is idempotent
        shell: bash
        run: |
          set -euo pipefail
          git add data/strings/compiled data/strings/reports data/index.json data/analysis-index.json data/lessons.json data/roles.json data/status.json data/page-health.json data/terrain-map.json dist sw.js pages/build-health.html pages/archives.html pages/vextreme-demo.html pages/specimens.html pages/specimen-*.html pages/ecosystem-hub.html pages/roles-index.html sitemap.xml index.html widgets/fab-lang.js lib/shell.js lib/vextreme.js pages/terrain-map.html pages/about-vextreme.html pages/vex-support.html
          if git diff --cached --quiet; then
            echo '{"generatedRuntimeDrift":0}'
          else
            echo "Generated/runtime drift remains:"
            git diff --cached --stat
            exit 1
          fi

      - name: Remove proof executor
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/content-forge-full-proof.yml
          git config user.name "VexGPT"
          git config user.email "victor.gong@vextreme24.com"
          git commit -m "test(content-forge): record exact-head full proof [VXG RealForever]" -m "Full repository tests and exact build-index regeneration passed on the converged recovered-content head; remove the temporary proof executor." -m "Signed-off-by: VexGPT <victor.gong@vextreme24.com>"
          git push origin HEAD:VXG-102826-chatgpt-content-forge-remaining-ports-generated-a001
