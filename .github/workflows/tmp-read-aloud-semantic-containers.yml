name: Temporary Read Aloud semantic-container authoring

on:
  push:
    branches:
      - VXG-102026-chatgpt-read-aloud-semantic-containers

jobs:
  author:
    if: github.event.head_commit.message == 'VXG-102026: stage read-aloud semantic-container authoring [VXG RealForever]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout exact authoring branch
        uses: actions/checkout@v4
        with:
          ref: VXG-102026-chatgpt-read-aloud-semantic-containers
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install exact dependencies
        run: npm ci

      - name: Apply semantic-container readability repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one exact occurrence, found {count}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          def regex_once(path, pattern, replacement):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              updated, count = re.subn(pattern, lambda _: replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{path}: expected one regex occurrence, found {count}: {pattern}')
              p.write_text(updated, encoding='utf-8')

          widget = 'widgets/fab-read-aloud.js'

