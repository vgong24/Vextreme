name: Direct Contact deterministic generation carrier

on:
  push:
    branches:
      - VXG-102926-direct-contact-generation-carrier-a001

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact carrier head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Reproject group homes
        run: node tools/vex-content-forge/project_group_homes.js

      - name: Run canonical generation
        run: |
          node lib/strings-compile.js
          node lib/build-string-identity-index.js
          node lib/build-arc-bundles.js
          node lib/build-index.js
          node lib/bump-fab-version.js
          node lib/build-shared-cache-generation.js
          node lib/build-vextreme.js
          node lib/build-sw.js
          node lib/build-analysis-index.js
          node lib/build-page-health.js
          node lib/build-archives.js
          node lib/build-demo.js
          node lib/build-specimens.js
          node lib/build-sitemap.js
          node lib/build-index-page.js
          node lib/build-lessons.js
          node lib/build-status.js
          node lib/build-roles.js
          node lib/build-ecosystem-hub.js
          node lib/build-roles-page.js
          node lib/build-terrain-map.js

      - name: Focused verification
        run: |
          node --test --test-concurrency=1 \
            tests/08-build-vextreme.test.js \
            tests/28-build-terrain-map.test.js \
            tests/44-page-health.test.js \
            tests/71-content-forge-direct-contact-arc-batch.test.js \
            tests/85-terrain-view-contract.test.js \
            tests/86-terrain-entry-pages.test.js
          node lib/check-key-alignment.js

      - name: Commit deterministic generated consequences
        shell: bash
        run: |
          git add \
            data/strings/compiled \
            data/strings/reports \
            data/index.json \
            data/analysis-index.json \
            data/lessons.json \
            data/roles.json \
            data/status.json \
            data/page-health.json \
            data/terrain-map.json \
            dist \
            sw.js \
            pages/build-health.html \
            pages/archives.html \
            pages/vextreme-demo.html \
            pages/specimens.html \
            pages/specimen-*.html \
            pages/ecosystem-hub.html \
            pages/roles-index.html \
            pages/direct-contact.html \
            sitemap.xml \
            index.html \
            widgets/fab-lang.js \
            lib/shell.js \
            lib/vextreme.js \
            pages/terrain-map.html \
            pages/about-vextreme.html \
            pages/vex-support.html
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "VexGPT"
          git config user.email "victor.gong@vextreme24.com"
          git commit -m "VXG-102926: regenerate Direct Contact localization runtime [VXG RealForever]"
          git push origin HEAD:${{ github.ref_name }}
